<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--app-head-->
    <meta name="author" content="Jennifer Ouedraogo" />
    <meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Appliqué avant l'affichage : thème choisi (ou préférence système) et activation des animations.
      (function () {
        var root = document.documentElement;
        root.classList.add('js');
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light' || saved === 'dark') root.dataset.theme = saved;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
